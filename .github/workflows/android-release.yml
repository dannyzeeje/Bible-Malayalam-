name: Build Universal Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          os.umask(0o077)
          key = Path(os.environ['RUNNER_TEMP']) / 'word-release.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          def escape(value):
              return ''.join('\\u%04x' % unit for unit in [int.from_bytes(value.encode('utf-16-be')[i:i+2], 'big') for i in range(0, len(value.encode('utf-16-be')), 2)])
          properties = {
              'storeFile': str(key),
              'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
          }
          Path('android/key.properties').write_text(''.join(k + '=' + escape(v) + '\n' for k, v in properties.items()))
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build signed universal release APK
        run: flutter build apk --release
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Upload signed universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Malayalam-Bible-universal-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/word-release.jks"
